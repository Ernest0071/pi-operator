[project]
name = "pi-operator"
version = "0.1.0"
description = "Autonomous operators that complete dealership workflows by driving a DMS through a browser."
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.48",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "rich>=13.9",
    "typer>=0.15",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
pi = "pi_operator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pi_operator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Cleanup and teardown paths deliberately swallow errors: a browser that
    # fails to close must not mask the run's actual outcome.
    "SIM105",
    "B008",    # FastAPI/typer dependency defaults are call-in-default by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "E501"]        # broad-exception asserts are the point; test data reads better wide
"mock_dms/db.py" = ["E501"]         # the seed table is a fixture; columnar rows beat wrapped ones
"pi_operator/api/main.py" = ["E501"]  # embedded console HTML/JS, not Python
"pi_operator/audit/trace.py" = ["E501"]  # embedded report HTML
