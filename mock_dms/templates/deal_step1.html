{% extends "base.html" %}{% block body %}{% set p = rid() %}
<h1>New Deal</h1>
<div class="steps"><span class="active">1. Customer</span><span>2. Vehicle</span><span>3. F&amp;I and Submit</span></div>
{% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
<div class="card"><form method="post" action="/deals/new?step=1">
  <label for="d{{ p }}_cust">Customer</label>
  <select id="d{{ p }}_cust" name="customer_id">
    <option value="">-- select a customer --</option>
    {% for c in customers %}<option value="{{ c.id }}"
      {% if draft.customer_id == c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
  </select>
  <div style="margin-top:1rem"><button type="submit">Continue to Vehicle</button></div>
</form></div>
{% endblock %}
