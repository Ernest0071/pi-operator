{% extends "base.html" %}{% block body %}{% set p = rid() %}
<h1>New Deal</h1>
<div class="steps"><span>1. Customer</span><span class="active">2. Vehicle</span><span>3. F&amp;I and Submit</span></div>
{% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
<div class="card"><form method="post" action="/deals/new?step=2">
  <label for="d{{ p }}_veh">Vehicle</label>
  <select id="d{{ p }}_veh" name="vehicle_id">
    <option value="">-- select a vehicle --</option>
    {% for v in vehicles %}<option value="{{ v.id }}"
      {% if draft.vehicle_id == v.id %}selected{% endif %}>{{ v.stock_no }} — {{ v.year }}
      {{ v.make }} {{ v.model }} (${{ '{:,.0f}'.format(v.price or 0) }})</option>{% endfor %}
  </select>
  <div style="margin-top:1rem">
    <a class="btn secondary" href="/deals/new?step=1">Back</a>
    <button type="submit">Continue to F&amp;I</button></div>
</form></div>
{% endblock %}
