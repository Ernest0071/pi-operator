<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>{% block title %}Apex Motors DMS{% endblock %}</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; color: #1a1a1a; background: #f6f7f9; }
  header { background: #1f2937; color: #fff; padding: .6rem 1.2rem; display: flex;
           align-items: center; gap: 1.4rem; }
  header .brand { font-weight: 700; letter-spacing: .02em; }
  header nav a { color: #cbd5e1; text-decoration: none; margin-right: 1rem; }
  header nav a:hover { color: #fff; }
  header .spacer { flex: 1; }
  main { max-width: 1040px; margin: 1.5rem auto; padding: 0 1.2rem; }
  h1 { font-size: 1.25rem; margin: 0 0 1rem; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1.1rem;
          margin-bottom: 1.1rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid #eef0f3; }
  th { font-size: .74rem; text-transform: uppercase; color: #6b7280; letter-spacing: .04em; }
  label { display: block; font-size: .8rem; color: #374151; margin: .7rem 0 .2rem; font-weight: 600; }
  input, select { padding: .4rem .55rem; border: 1px solid #d1d5db; border-radius: 5px;
                  font: inherit; min-width: 240px; }
  button, .btn { background: #2563eb; color: #fff; border: 0; border-radius: 5px;
                 padding: .5rem .9rem; font: inherit; cursor: pointer; text-decoration: none;
                 display: inline-block; }
  button.secondary { background: #6b7280; }
  .error { color: #b91c1c; font-size: .8rem; margin-top: .2rem; }
  .alert { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
           padding: .6rem .8rem; border-radius: 6px; margin-bottom: 1rem; }
  .ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534;
        padding: .6rem .8rem; border-radius: 6px; margin-bottom: 1rem; }
  .steps { display: flex; gap: .5rem; margin-bottom: 1rem; font-size: .8rem; }
  .steps span { padding: .25rem .6rem; border-radius: 99px; background: #e5e7eb; color: #6b7280; }
  .steps span.active { background: #2563eb; color: #fff; }
  .muted { color: #6b7280; font-size: .82rem; }
  fieldset { border: 1px solid #e5e7eb; border-radius: 6px; margin: 0 0 1rem; padding: .6rem 1rem 1rem; }
  legend { font-size: .78rem; text-transform: uppercase; color: #6b7280; letter-spacing: .04em; }
</style></head>
<body>
{% if user %}
<header>
  <span class="brand">APEX MOTORS</span>
  <nav>
    <a href="/">Dashboard</a><a href="/inventory">Inventory</a><a href="/customers">Customers</a>
    <a href="/deals">Deals</a><a href="/service">Service</a><a href="/reports/aging">Reports</a>
  </nav>
  <span class="spacer"></span>
  <span class="muted" style="color:#9ca3af">{{ user }}</span>
  <a href="/logout" style="color:#cbd5e1;margin-left:1rem">Sign out</a>
</header>
{% endif %}
<main>{% block body %}{% endblock %}</main>
</body></html>
