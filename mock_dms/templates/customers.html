{% extends "base.html" %}{% block body %}
<h1>Customers</h1>
<div class="card"><a class="btn" href="/customers/new">Add Customer</a></div>
<div class="card"><table>
  <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Group</th></tr></thead>
  <tbody>{% for c in customers %}
    <tr><td>{{ c.name }}</td><td>{{ c.email }}</td><td>{{ c.phone }}</td>
        <td>{{ c.customer_group }}</td></tr>
  {% endfor %}</tbody>
</table></div>
{% endblock %}
